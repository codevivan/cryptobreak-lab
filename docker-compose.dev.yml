services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: cryptobreak-lab:dev
    container_name: cryptobreak-lab-dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
